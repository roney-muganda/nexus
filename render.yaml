services:
  - type: web
    name: nexus-hub
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn hub.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: DATABASE_URL
        fromDatabase:
          name: nexus-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: nexus-redis
          type: redis
          property: connectionString
      - key: APP_NAME
        value: nexus
      - key: DEBUG
        value: "false"  
      
      # ── LLM & Bot Keys ──
      - key: GROQ_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
        
      # ── Security & Auth ──
      - key: SECRET_KEY
        sync: false
      - key: HMAC_SECRET
        sync: false
      - key: JWT_ALGORITHM
        value: HS256
      - key: JWT_PRIVATE_KEY
        sync: false
      - key: JWT_PUBLIC_KEY
        sync: false
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "60"
        
      # ── ChromaDB Cloud ──
      - key: CHROMA_API_KEY
        sync: false
      - key: CHROMA_TENANT
        sync: false
      - key: CHROMA_DATABASE
        sync: false   

  - type: redis
    name: nexus-redis
    plan: free
    maxmemoryPolicy: allkeys-lru
    ipAllowList: []

databases:
  - name: nexus-postgres
    plan: free
    databaseName: nexus_db
    user: nexus_user
    ipAllowList: []